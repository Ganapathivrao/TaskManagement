name: .NET Cl

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      -name: Checkout source code
      uses: actions/Checkout@v4

      -name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
          dotnet-version: '10.0.x'

      -name: Restore dependencies
      run: dotnet restore

      -name: Build Project
      run: dotnet build --configuration Release --no-restore